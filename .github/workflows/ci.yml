name: CI
 
on:
  pull_request:
    branches: [develop, main]
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
 
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test